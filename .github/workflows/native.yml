name: Native device and serial adapters
# Exercise native device and serial APIs separately from the core tests.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 20
    env:
      ABLA_NATIVE_JOBS: 2
      ABLA_CODEGEN_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: AndreBaltazar8/setup-abla@f13f659af61ed16f0f2568964ff5b5f3344ec70a # main, signed Abla v0.2.67 support
        with:
          version: '0.2.67'
      - name: Record released compiler
        run: ablac --version
      - name: Native character-device and PTY simulations (no hardware)
        run: make test-native COMPILER=ablac
