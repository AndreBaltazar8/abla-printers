name: Native device and serial adapters
# Released native APIs are separate from the core's0.2.45 compatibility gate.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 20
    env:
      ABLA_NATIVE_JOBS: 2
      ABLA_CODEGEN_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: AndreBaltazar8/setup-abla@13c3fdc74b5961bf2d281b25c47e4b9ace18d11e
        with:
          version: '0.2.47'
      - name: Record released compiler
        run: ablac --version
      - name: Native character-device and PTY simulations (no hardware)
        run: make test-native COMPILER=ablac
