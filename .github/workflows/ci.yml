name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: AndreBaltazar8/setup-abla@b21e1290aa49862e7bf187dc84b6b3511f4b571e # v1.0.0
        with:
          version: '0.2.45'
      - name: Golden encoders and bounded fake TCP printer
        run: make test-in-shell COMPILER=ablac
      - name: Parse the generated SOAP document independently
        run: nix-shell -p libxml2 --run 'xmllint --nonet --noout build/receipt.xml'
